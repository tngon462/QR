<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181c24"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="T-NGON Live"><title>T-NGON Live</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#181c24;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:calc(24px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));min-height:100dvh}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#a9b8ca;font-weight:700}h1{font-size:25px;margin:6px 0 0}button{background:#343c4b;border:1px solid #566173;color:#fff;border-radius:12px;padding:12px 15px;font-size:14px;font-weight:700}button:active{opacity:.7}.status{display:flex;align-items:center;gap:8px;color:#b9c5d5;font-size:13px;margin:24px 0 14px}.dot{width:8px;height:8px;background:#f2b65e;border-radius:50%}.dot.ok{background:#57d59c}.dot.err{background:#ff7777}.cards{display:grid;gap:12px}.card{background:#242b37;border:1px solid #3a4351;border-radius:18px;padding:19px 16px}.name{color:#b9c5d5;font-size:12px;letter-spacing:.12em;font-weight:800}.number{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(30px,10vw,49px);font-weight:800;letter-spacing:1px;margin-top:7px}.number.bad{color:#ff8585}.meta{margin-top:20px;color:#9eacbe;font-size:12px;line-height:1.8}.foot{margin-top:25px;color:#7e8da2;font-size:11px} @media(min-width:650px){body{max-width:720px;margin:auto}.cards{grid-template-columns:repeat(3,1fr)}.card{padding:16px 10px}.number{font-size:clamp(17px,3vw,28px);letter-spacing:0}}
</style></head><body><header><div><div class="eyebrow">T-NGON COUNTER</div><h1>Doanh thu hôm nay</h1></div><button id="refresh" type="button">↻ Làm mới</button></header><div class="status"><span id="dot" class="dot"></span><span id="state">Đang kết nối Firebase…</span></div><main class="cards"><section class="card"><div class="name">HONTEN</div><div id="honten" class="number">------</div></section><section class="card"><div class="name">RESTAURANT</div><div id="restaurant" class="number">------</div></section><section class="card"><div class="name">MITSU</div><div id="mitsu" class="number">------</div></section></main><div class="meta"><div>Ngày kinh doanh: <span id="day">—</span></div><div>Đọc Firebase: <span id="readAt">—</span></div><div id="notice">Dữ liệu chỉ đọc. Không tác động POS.</div></div><div class="foot">Tự kiểm tra mỗi 15 giây khi ứng dụng đang mở. iOS có thể tạm dừng khi chạy nền.</div><script>
'use strict';
const URL='https://tngon-b37d6-default-rtdb.asia-southeast1.firebasedatabase.app/tngonCounter/v1.json';
const ids=['honten','restaurant','mitsu'];let busy=false;
const $=id=>document.getElementById(id);
function todayJST(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).replace(/\//g,'-')}
function clock(){return new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date())}
function setState(msg,cls){$('state').textContent=msg;$('dot').className='dot '+cls}
function slot(obj){if(!obj||typeof obj!=='object')return '------';if(String(obj.status||'').toLowerCase()==='auth_required')return '!!!!!!';if(String(obj.status||'').toLowerCase()!=='fresh'||obj.revenue==null)return '------';const n=Number(obj.revenue);return Number.isFinite(n)&&n>=0&&n<=999999?String(Math.floor(n)).padStart(6,'0'):'------'}
async function refresh(){if(busy)return;busy=true;$('refresh').disabled=true;setState('Đang đọc Firebase…','');try{const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),10000);let res;try{res=await fetch(URL+'?t='+Date.now(),{cache:'no-store',signal:ctl.signal})}finally{clearTimeout(timer)}if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!data||typeof data!=='object'||data.error)throw new Error('Dữ liệu không hợp lệ');const day=String(data.business_date||'').slice(0,10);$('day').textContent=day||'—';const valid=day===todayJST();ids.forEach(id=>{const value=valid?slot(data[id]):'------';$(id).textContent=value;$(id).classList.toggle('bad',value==='!!!!!!')});$('readAt').textContent=clock();$('notice').textContent=valid?'Đã đọc dữ liệu. “------” nghĩa là chưa có số liệu fresh.':'Ngày kinh doanh không trùng ngày hiện tại tại Nhật; không hiển thị doanh thu cũ.';setState(valid?'Đã kết nối · '+clock():'Dữ liệu khác ngày hôm nay',valid?'ok':'err')}catch(e){setState('Không đọc được Firebase','err');$('notice').textContent='Lỗi kết nối: '+String(e.message||e)+'. Số đang hiển thị có thể đã cũ.'}finally{busy=false;$('refresh').disabled=false}}
$('refresh').addEventListener('click',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('pageshow',refresh);setInterval(()=>{if(!document.hidden)refresh()},15000);refresh();
</script></body></html>
